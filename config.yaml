# How often to check prices, in seconds (minimum 10).
# CoinGecko's free API is rate limited, so 60 is a safe choice.
poll_seconds: 60

# Currency to compare prices in (usd, eur, gbp, ...).
vs_currency: usd

# Default wait before the same alert can be sent again (minutes).
# Each alert can override this with its own cooldown_minutes.
cooldown_minutes: 240  # 4 hours, so a price sitting past a level doesn't spam you

# Your alerts.
#   coin:      the CoinGecko coin id (see the README for how to find it),
#              e.g. bitcoin, ethereum, solana, dogecoin
#   condition: above  -> price goes above threshold
#              below  -> price goes below threshold
#              change -> price moves by threshold % within window_minutes
#   threshold: a price for above/below, a percent for change (e.g. 5 = 5%)
#   direction: (change only) up, down or any. Default: any
#   window_minutes: (change only) how far back to compare. Default: 60
#   name:      (optional) a friendly label shown in the alert
alerts:
  # Bitcoin
  - coin: bitcoin
    condition: above
    threshold: 90000
    name: BTC breakout
  - coin: bitcoin
    condition: below
    threshold: 80000
    name: BTC dip

  # Ethereum
  - coin: ethereum
    condition: above
    threshold: 3000
    name: ETH breakout
  - coin: ethereum
    condition: below
    threshold: 2500
    name: ETH dip

  # Solana
  - coin: solana
    condition: above
    threshold: 135
    name: SOL breakout
  - coin: solana
    condition: below
    threshold: 110
    name: SOL dip

  # Sudden moves: 5% up or down within 1 hour
  - coin: bitcoin
    condition: change
    threshold: 5
    window_minutes: 60
    cooldown_minutes: 60
    name: BTC big move
  - coin: ethereum
    condition: change
    threshold: 5
    window_minutes: 60
    cooldown_minutes: 60
    name: ETH big move
  - coin: solana
    condition: change
    threshold: 5
    window_minutes: 60
    cooldown_minutes: 60
    name: SOL big move
